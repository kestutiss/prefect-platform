name: prefect-platform
prefect-version: "3"

# No build or push steps — code is mounted as a Docker volume
build: null
push: null

# Tell the worker where to find the code (already mounted at /app)
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app

deployments:
  - name: hello-world-default
    version: "1.0"
    tags:
      - example
    description: "Simple hello world flow demonstrating Prefect 3.x basics"
    entrypoint: flows/examples/hello_world.py:hello_world_flow
    parameters: {}
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables:
        image: prefect-platform:local
        name: "hello-world"
        networks:
          - prefect-network
        env:
          PREFECT_API_URL: http://prefect-server:4200/api
          PYTHONPATH: /app
        auto_remove: true
    schedules: []

  - name: etl-example-default
    version: "1.0"
    tags:
      - example
      - etl
    description: "Sample ETL pipeline: extract → transform → load"
    entrypoint: flows/examples/etl_example.py:etl_example_flow
    parameters: {}
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables:
        image: prefect-platform:local
        name: "etl-example"
        networks:
          - prefect-network
        env:
          PREFECT_API_URL: http://prefect-server:4200/api
          PYTHONPATH: /app
        auto_remove: true
    schedules: []

  - name: deactivate-expired-coupon-default
    version: "1.0"
    tags:
      - mongodb
    description: "Find the most expired active coupon in MongoDB and deactivate it"
    entrypoint: flows/mongodb/deactivate_expired_coupon.py:deactivate_expired_coupon_flow
    parameters: {}
    work_pool:
      name: local-pool
      work_queue_name: default
      job_variables:
        image: prefect-platform:local
        name: "deactivate-expired-coupon"
        networks:
          - prefect-network
        env:
          PREFECT_API_URL: http://prefect-server:4200/api
          PYTHONPATH: /app
          MONGO_URI: mongodb://mongo:27017   # service name on prefect-network
        auto_remove: true
    schedules: []
